# Static file server for the NEXUS Console production build (Phase 7).
#
# The Console is a client-side-routed React app (react-router-dom): any
# path that isn't a real static file must fall back to index.html so a
# direct load of, e.g., /runs/req-abc123 works instead of 404ing at the
# server. This server does not proxy API requests -- the Console calls the
# NEXUS API directly (VITE_NEXUS_API_BASE_URL, baked in at build time) and
# relies on the API's own CORS configuration (NEXUS_CONSOLE_ORIGINS).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames (Vite's default) are safe to cache long-term;
    # index.html itself is intentionally not matched by this block, so it
    # is always revalidated and never serves a stale asset manifest.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
