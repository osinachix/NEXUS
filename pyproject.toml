[project]
name = "multi-agent-router"
version = "0.1.0"
description = "A LangGraph chatbot that classifies each message and routes it to a specialist agent (counselor, logical, math, or coding)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29.5",
    "langchain[anthropic]>=0.3.24",
    "langgraph>=0.3.34",
    "python-dotenv>=1.1.0",
    "tenacity>=9.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
# Only needed when NEXUS_DATABASE_URL is configured (Phase 5's "production-
# like" durable backend -- see ARCHITECTURE.md). Not required for the
# SQLite/development default, and not installed by `pip install -e .`
# alone -- see README "Running with PostgreSQL".
postgres = [
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
