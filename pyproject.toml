[project]
name = "multi-agent-router"
version = "0.1.0"
description = "A LangGraph chatbot that classifies each message and routes it to a specialist agent (counselor, logical, math, or coding)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29.5",
    "langchain[anthropic]>=0.3.24",
    "langgraph>=0.3.34",
    "python-dotenv>=1.1.0",
]
